[project]
name = "inkparse"
version = "0.4.0a1"
description = "独立的文档解析与结构化JSON交换核心"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.13"
dependencies = ["docling-core==2.106.0", "pydantic>=2.12,<3", "pypdf>=6,<7", "inkstore==0.1.0a1", "beautifulsoup4>=4.13,<5", "python-docx>=1.2,<2", "python-pptx>=1.0.2,<2", "pillow>=11,<14"]

[project.urls]
Source = "https://github.com/chenyk2016/inkrag/tree/main/packages/inkparse"
Documentation = "https://github.com/chenyk2016/inkrag/blob/main/docs/parsing-core.md"
Issues = "https://github.com/chenyk2016/inkrag/issues"

[project.optional-dependencies]
docling = ["docling-slim[standard,feat-ocr-rapidocr-onnx]==2.150.0", "torch>=2.2.2,<3", "torchvision>=0,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inkparse"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
